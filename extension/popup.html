<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>job-hunt</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><h1>job-hunt</h1><span id="version" class="badge">0.3.0</span></header>
<p class="intro">连接你手动登录的 BOSS 标签页，由本机 WorkBuddy 查询岗位列表和职责详情。</p>
<div class="connection"><span id="phase" class="badge">未连接</span><p id="status" role="status" aria-live="polite">正在读取本机配置…</p></div>
<form id="connection-form">
<label for="key">本机配对码</label>
<input id="key" type="password" autocomplete="off" spellcheck="false" maxlength="64" placeholder="粘贴本地服务生成的配对码" aria-describedby="key-help">
<p id="key-help" class="note">复制 WorkBuddy 提供的本机配对码粘贴于此，无需回复配对码。</p>
<div class="actions"><button id="connect" type="submit">连接当前标签页</button><button id="disconnect" type="button">断开</button></div>
</form>
<p class="note">遇到登录、验证或请求异常会暂停。人工处理后，点击连接恢复。断开后不会继续派发请求，已发送的请求可能仍会完成。</p>
<details><summary>连接诊断</summary>
<p class="note">只检查本机连接，不搜索岗位、不验证账号登录状态。</p>
<div class="actions"><button id="diagnose" type="button">检查连接</button><button id="copy-report" type="button" disabled>复制诊断</button></div>
<textarea id="report" readonly hidden aria-label="不含配对码的连接诊断"></textarea>
</details>
<section><h2>本机工作台</h2><p class="note">求职配置、岗位、话术编辑与发送队列统一在工作台处理。插件只负责连接与执行当前授权标签页的动作。</p><button id="open-dashboard" type="button">打开工作台</button></section>
<footer>仅连接当前授权标签页 · 查询结果保存在本机</footer>
<script src="popup.js"></script>
</body></html>
